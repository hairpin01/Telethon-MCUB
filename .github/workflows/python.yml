name: Python Library

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-asyncio
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 telethon/ --max-line-length=100 --ignore=E501,W503,E231,E252,E127,E128,E123,E306,F401,W293,W291,W504,E302,E305,E303,E111,E226,E126,F841,F811,E301,E731,F821,F824,F403,F405,E704,E241,E203,E122,E121,W391,E211
    - name: Test with pytest
      run: |
        pytest tests/telethon/ -v --ignore=tests/readthedocs
